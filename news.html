<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — NCBO</title>
  <meta name="description" content="Season news, new clubs, events, and community wins from NCBO.">
  <link rel="icon" href="assets/ncbo-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <section class="page-hero">
    <img class="page-hero-crest" src="assets/ncbo-logo.webp" alt="">
    <div class="wrap">
      <p class="eyebrow">News &amp; Updates</p>
      <h1 class="h-display">What's happening.</h1>
      <p>Season news, new clubs joining the network, events, and community wins. Add new posts by editing the <code>news</code> list in <code>assets/data.js</code>.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="news-grid" id="news"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/data.js"></script>
  <script>
    window.NCBO_PAGE = function (R) { R.news(document.querySelector('#news')); };
  </script>
  <script src="assets/site.js"></script>
</body>
</html>
