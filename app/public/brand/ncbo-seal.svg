<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Solid Navy Background for Mass & Strength -->
  <circle cx="150" cy="150" r="140" fill="#152A47"/>
  
  <!-- Single Crisp Steel Grey Boundary Ring -->
  <circle cx="150" cy="150" r="128" fill="none" stroke="#B8C5D1" stroke-width="4"/>
  
  <!-- Anchor Star (Medium Steel Blue) -->
  <polygon points="150,56 154,68 167,68 156,76 160,88 150,80 140,88 144,76 133,68 146,68" fill="#6B84A6"/>
  
  <!-- The Barbell (Stripped down to heavy, minimal geometry) -->
  <!-- Main Bar (Steel Grey) -->
  <rect x="70" y="132" width="160" height="10" fill="#B8C5D1" rx="1"/>
  <!-- Heavy Plates (Medium Blue) -->
  <rect x="85" y="116" width="18" height="42" fill="#6B84A6" rx="2"/>
  <rect x="202" y="116" width="18" height="42" fill="#6B84A6" rx="2"/>
  
  <!-- NCBO Text - No strokes, just pure, heavy block letters -->
  <text x="150" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NCBO</text>
  
  <!-- EST. 2024 (Steel Grey) -->
  <text x="150" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#B8C5D1" text-anchor="middle" letter-spacing="6">EST. 2024</text>
</svg>
