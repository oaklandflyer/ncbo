<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join NCBO — Become a Member</title>
  <meta name="description" content="Become a member of NCBO. Find your club, join during the founding phase for free, and train for a real collegiate season.">
  <link rel="icon" href="assets/ncbo-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <section class="page-hero">
    <img class="page-hero-crest" src="assets/ncbo-logo.webp" alt="">
    <div class="wrap">
      <p class="eyebrow">Join Now</p>
      <h1 class="h-display">Become a member.</h1>
      <p>Get plugged into a club at your school, train for a real season, and join a community that shows up year-round. During our founding phase, membership is free.</p>
      <div class="hero-actions" style="margin-top:1.8rem">
        <a class="btn btn-primary" id="join-cta" href="clubs.html">Find your club</a>
      </div>
    </div>
  </section>

  <!-- HOW TO JOIN -->
  <section class="section">
    <div class="wrap">
      <div class="reveal" style="margin-bottom:2.4rem">
        <p class="eyebrow">How it works</p>
        <h2 class="h-display" style="margin-top:1rem">Four steps in.</h2>
      </div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/data.js"></script>
  <script>
    window.NCBO_PAGE = function (R) {
      const D = window.NCBO_DATA, $ = s => document.querySelector(s);
      if (D.forms && D.forms.becomeMember && D.forms.becomeMember !== '#') $('#join-cta').href = D.forms.becomeMember;
      R.steps($('#steps'));
      R.tiers($('#tiers-grid'));
    };
  </script>
  <script src="assets/site.js"></script>
</body>
</html>
