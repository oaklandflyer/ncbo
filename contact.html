<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — NCBO</title>
  <meta name="description" content="Get in touch with NCBO — questions, partnerships, club affiliation, or just to say hi.">
  <meta name="keywords" content="NCBO, thencbo, the NCBO, National Collegiate Bodybuilding Organization, collegiate bodybuilding, college bodybuilding, collegiate bodybuilding organization, college bodybuilding club, collegiate bodybuilding club, bodybuilding club, collegiate bodybuilding league, campus bodybuilding, college bodybuilding team, collegiate fitness, college fitness club, bodybuilding competition college, student bodybuilding, NCBO bodybuilding, thencbo.org">
  <meta name="author" content="NCBO — National Collegiate Bodybuilding Organization">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://thencbo.org/contact.html">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NCBO — National Collegiate Bodybuilding Organization">
  <meta property="og:title" content="Contact — NCBO">
  <meta property="og:description" content="Get in touch with NCBO — questions, partnerships, club affiliation, or just to say hi.">
  <meta property="og:url" content="https://thencbo.org/contact.html">
  <meta property="og:image" content="https://thencbo.org/assets/ncbo-logo.webp">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Contact — NCBO">
  <meta name="twitter:description" content="Get in touch with NCBO — questions, partnerships, club affiliation, or just to say hi.">
  <meta name="twitter:image" content="https://thencbo.org/assets/ncbo-logo.webp">
  <meta name="theme-color" content="#0A1228">
  <link rel="icon" href="assets/ncbo-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <section class="page-hero">
    <img class="page-hero-crest" src="assets/ncbo-logo.webp" alt="">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <h1 class="h-display">Get in touch.</h1>
      <p>Questions about joining, affiliating a club, partnerships, or anything else — we read everything.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap split">
      <div class="reveal">
        <p class="eyebrow">Reach us directly</p>
        <h2 class="h-display" style="margin-top:1rem">We'd love<br>to hear from you.</h2>
        <div style="margin-top:1.8rem; display:grid; gap:1.4rem">
          <div>
            <div style="font-family:var(--font-display); font-weight:700; letter-spacing:0.1em; text-transform:uppercase; font-size:0.8rem; color:var(--steel)">Email</div>
            <a id="contact-email" href="#" style="color:var(--white); font-size:1.1rem"></a>
          </div>
          <div>
            <div style="font-family:var(--font-display); font-weight:700; letter-spacing:0.1em; text-transform:uppercase; font-size:0.8rem; color:var(--steel)">Instagram</div>
            <a id="contact-ig" href="#" target="_blank" rel="noopener" style="color:var(--white); font-size:1.1rem"></a>
          </div>
          <div>
            <div style="font-family:var(--font-display); font-weight:700; letter-spacing:0.1em; text-transform:uppercase; font-size:0.8rem; color:var(--steel)">Want to start a club?</div>
            <a href="index.html#start" style="color:var(--white); font-size:1.1rem">Apply on the Start a Club page →</a>
          </div>
        </div>
      </div>
      <div class="reveal">
        <form class="form" data-contact>
          <div class="field">
            <label for="cname">Name</label>
            <input id="cname" name="name" type="text" required>
          </div>
          <div class="field">
            <label for="cemail">Email</label>
            <input id="cemail" name="email" type="email" required>
          </div>
          <div class="field">
            <label for="ctopic">Topic</label>
            <select id="ctopic" name="topic">
              <option>Joining NCBO</option>
              <option>Starting / affiliating a club</option>
              <option>Partnership or sponsorship</option>
              <option>Press</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="field">
            <label for="cmsg">Message</label>
            <textarea id="cmsg" name="message" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p class="nl-msg" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/data.js"></script>
  <script>
    window.NCBO_PAGE = function (R) {
      const D = window.NCBO_DATA, $ = s => document.querySelector(s);
      const em = $('#contact-email'); em.textContent = D.org.email; em.href = 'mailto:' + D.org.email;
      const ig = $('#contact-ig'); ig.textContent = D.org.instagramHandle || 'Instagram'; ig.href = D.org.instagram || '#';
      const form = $('form[data-contact]');
      form.addEventListener('submit', e => {
        e.preventDefault();
        form.querySelector('.nl-msg').textContent = "Message sent — we'll get back to you soon.";
        form.reset();
      });
    };
  </script>
  <script src="assets/site.js"></script>
</body>
</html>
