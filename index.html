<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCBO — National Collegiate Bodybuilding Organization</title>
  <meta name="description" content="NCBO is the governing body for collegiate bodybuilding — school-affiliated clubs, a real season, school-vs-school competition, and a year-round community. Find your club, become a member, start building.">
  <link rel="icon" href="assets/ncbo-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <!-- HERO -->
  <section class="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-grid"></div>
    <img class="hero-crest" src="assets/ncbo-logo.webp" alt="">
    <div class="hero-inner">
      <p class="eyebrow up d1" id="hero-eyebrow"></p>
      <h1 class="up d2" id="hero-title"></h1>
      <div class="tag-chip up d3" id="hero-chip"></div>
      <p class="hero-sub up d4" id="hero-sub"></p>
      <div class="hero-actions up d5" id="hero-actions"></div>
    </div>
  </section>

  <!-- VALUE MARQUEE -->
  <div class="marquee" id="marquee" aria-hidden="true"></div>

  <!-- CTA TILES -->
  <section aria-label="Get started" class="section--tight" style="padding:0">
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- WHAT WE ARE -->
  <section class="section" id="about">
    <div class="wrap split">
      <div class="reveal">
        <p class="eyebrow" id="about-label"></p>
        <h2 class="h-display" id="about-head" style="margin-top:1.1rem"></h2>
      </div>
      <div class="reveal">
        <div id="about-body"></div>
        <div class="stats" id="about-stats"></div>
      </div>
    </div>
  </section>

  <!-- PILLARS -->
  <section class="section" style="background:var(--navy-deep); border-block:1px solid var(--line)">
    <div class="wrap">
      <div class="center reveal" style="max-width:640px; margin-inline:auto">
        <p class="eyebrow center-line">What members get</p>
        <h2 class="h-display" style="margin-top:1rem">Value you can't<br>build alone.</h2>
      </div>
      <div class="cards" id="pillars" style="margin-top:2.6rem"></div>
    </div>
  </section>

  <!-- FOUNDING CLUBS STRIP -->
  <section class="section">
    <div class="wrap">
      <div style="display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end; justify-content:space-between; margin-bottom:2.2rem">
        <div class="reveal">
          <p class="eyebrow">The network</p>
          <h2 class="h-display" style="margin-top:1rem">Founding clubs.</h2>
        </div>
        <a class="btn btn-ghost btn-arrow reveal" href="clubs.html">See all clubs</a>
      </div>
      <div class="clubs-grid" id="clubs-strip"></div>
    </div>
  </section>

  <!-- VOICES -->
  <section class="section" style="background:var(--navy-deep); border-block:1px solid var(--line)">
    <div class="wrap">
      <div class="center reveal" style="margin-bottom:2.6rem">
        <p class="eyebrow center-line">From the floor</p>
        <h2 class="h-display" style="margin-top:1rem">Why members<br>show up.</h2>
      </div>
      <div class="voices" id="voices"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="assets/data.js"></script>
  <script>
    window.NCBO_PAGE = function (R) {
      const D = window.NCBO_DATA, $ = s => document.querySelector(s);
      // hero
      $('#hero-eyebrow').textContent = D.hero.eyebrow;
      $('#hero-title').innerHTML = D.hero.title.join('<br>');
      $('#hero-chip').innerHTML = D.org.tagline.split('.').filter(Boolean)
        .map(s => s.trim()).map((s, i, a) => s + (i < a.length - 1 ? ' <b>·</b> ' : '')).join('');
      $('#hero-sub').textContent = D.hero.sub;
      $('#hero-actions').innerHTML =
        `<a class="btn btn-primary" href="${D.hero.primary.href}">${D.hero.primary.label}</a>
         <a class="btn btn-ghost btn-arrow" href="${D.hero.ghost.href}">${D.hero.ghost.label}</a>`;
      // marquee + tiles
      R.marquee($('#marquee'));
      R.tiles($('#tiles'));
      // about
      $('#about-label').textContent = D.about.label;
      $('#about-head').innerHTML = D.about.headline.join('<br>');
      $('#about-body').innerHTML = D.about.body.map(p => `<p class="lead">${p}</p>`).join('');
      $('#about-stats').innerHTML = D.about.stats.map(s =>
        `<div class="stat"><span class="stat-num">${s.num}</span><span class="stat-lab">${s.lab}</span></div>`).join('');
      // pillars / clubs / voices
      R.pillars($('#pillars'));
      R.clubsStrip($('#clubs-strip'), 4);
      R.voices($('#voices'));
    };
  </script>
  <script src="assets/site.js"></script>
</body>
</html>
